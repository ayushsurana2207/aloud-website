name = "aloud-website"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# shortcut: Resend's test sender only delivers to the Resend account owner; switch to "Aloud <hello@yourdomain>" once the domain is verified in Resend.
FROM_EMAIL = "Aloud <onboarding@resend.dev>"
REPLY_TO = "ayushsurana3@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "aloud-early-access"
# Replace after running: npx wrangler d1 create aloud-early-access
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secret (wrangler pages secret put RESEND_API_KEY, or .dev.vars locally): RESEND_API_KEY
