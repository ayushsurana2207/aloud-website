name = "aloud-website"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# The aloudedu.com domain must be verified in Resend (Domains) for this sender to deliver.
FROM_EMAIL = "Aloud <support@aloudedu.com>"
REPLY_TO = "support@aloudedu.com"

[[d1_databases]]
binding = "DB"
database_name = "aloud-early-access"
database_id = "e498af88-3d22-4516-a9c4-9a36f38bc7f8"
migrations_dir = "migrations"

# Secret (wrangler pages secret put RESEND_API_KEY, or .dev.vars locally): RESEND_API_KEY
